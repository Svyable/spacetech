[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svyable-spacetech"
version = "0.1.0"
description = "Research-stage geomagnetic disturbance estimation and evaluation tools"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
pinn = ["torch>=2.0"]

[project.scripts]
spacetech = "spacetech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
